<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>تصاميم تكنيكات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#349DD7; --blue-strong:#1F7CB6; --bg:#F1F2F6; --ink:#1B2533; --muted:#5A6577; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Readex Pro', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:min(1500px, calc(100% - 32px)); margin:0 auto; padding:24px 0 32px; }
    h1 { margin:0; text-align:center; font-weight:700; letter-spacing:-.3px; }
    .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:18px 0; }
    select, input, button { min-height:42px; border:1px solid #D5DAE3; border-radius:10px; background:#fff; color:var(--ink); font:inherit; }
    select { padding:0 12px; }
    input { width:min(420px, calc(100vw - 32px)); padding:0 12px; direction:ltr; }
    button { padding:0 18px; border:0; background:var(--blue-strong); color:#fff; font-weight:600; cursor:pointer; transition:transform .15s ease, background .15s ease; }
    button:hover { background:#176B9E; transform:translateY(-1px); }
    .comparison { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; transition:all .3s ease; }
    .comparison.is-app { display:flex; justify-content:center; align-items:flex-start; gap:28px; max-width:880px; margin:0 auto; }
    .comparison.is-app .panel { width:392px; flex:0 0 392px; border-radius:32px; box-shadow:0 16px 40px rgba(27,37,51,.15); }
    .comparison.is-app iframe { width:100%; height:844px; }
    .panel { min-width:0; border-radius:16px; overflow:hidden; background:#fff; box-shadow:0 4px 18px rgba(27,37,51,.08); transition:all .3s ease; }
    .panel-header { display:flex; align-items:center; justify-content:space-between; min-height:58px; padding:10px 14px; border-bottom:1px solid #E6E9EF; }
    .panel-header strong { font-size:16px; }
    .panel-header span { color:var(--muted); font-size:13px; }
    iframe { display:block; width:100%; height:calc(100vh - 210px); min-height:600px; border:0; background:#fff; transition:height .3s ease; }
    .old { border-top:4px solid #A7AFBA; }
    .new { border-top:4px solid var(--blue); }
    @media (max-width:900px) {
      .comparison { grid-template-columns:1fr; }
      iframe { height:72vh; }
    }
  </style>
</head>
<body>
  <main>
    <h1>تصاميم تكنيكات</h1>
    <div class="controls">
      <select id="platform" aria-label="نوع التصميم">
        <option value="website">الموقع</option>
        <option value="app">التطبيق</option>
      </select>
      <select id="page" aria-label="الصفحة"></select>
      <input id="newUrl" type="text" aria-label="رابط النسخة الجديدة" placeholder="رابط النسخة الجديدة بعد الاعتماد">
      <button id="loadNew" type="button">عرض النسخة الجديدة</button>
      <button id="replayAnimBtn" type="button" style="display:none; background:linear-gradient(135deg, #CE107E, #1F7CB6); color:#fff; font-weight:700; box-shadow:0 4px 12px rgba(206,16,126,0.25);">✨ إعادة تشغيل الأنميشن</button>
    </div>
    <div class="comparison">
      <section class="panel old">
        <div class="panel-header">
          <strong>الشكل الحالي</strong>
          <span>قبل التعديل</span>
        </div>
        <iframe id="oldFrame" title="الشكل الحالي"></iframe>
      </section>
      <section class="panel new">
        <div class="panel-header">
          <strong>الشكل الجديد</strong>
          <span>بعد الاعتماد</span>
        </div>
        <iframe id="newFrame" title="الشكل الجديد"></iframe>
      </section>
    </div>
  </main>
  <script>
    const pages = {
      website: [
        ['01-home.html', 'الرئيسية'],
        ['09-articles.html', 'المقالات'],
        ['10-videos.html', 'الفيديوهات'],
        ['03-services.html', 'الخدمات'],
        ['11-service-order.html', 'طلب الخدمة'],
        ['04-products.html', 'المنتجات'],
        ['05-events.html', 'الفعاليات'],
        ['02-photographer-profile.html', 'صفحة المصور'],
        ['06-event-details.html', 'تفاصيل الفعالية'],
        ['07-event-entry.html', 'المشاركة'],
        ['08-results-approval.html', 'اعتماد النتائج']
      ],
      app: [
        ['01-home.html', 'الرئيسية'],
        ['02-quick.html', 'زر الإضافة'],
        ['03-drawer.html', 'القائمة الجانبية'],
        ['04-profile.html', 'صفحة المصور'],
        ['05-profileinfo.html', 'معلومات المصور'],
        ['06-account.html', 'حالة الحساب'],
        ['07-services.html', 'الخدمات'],
        ['08-products.html', 'المنتجات'],
        ['09-videos.html', 'الفيديوهات'],
        ['10-events.html', 'الفعاليات'],
        ['11-event.html', 'داخل الفعالية'],
        ['12-entry.html', 'المشاركة الواحدة'],
        ['13-editprofile.html', 'تعديل الملف'],
        ['14-orders.html', 'طلباتي'],
        ['15-approval.html', 'اعتماد النتائج']
      ]
    };

    const platform = document.getElementById('platform');
    const page = document.getElementById('page');
    const oldFrame = document.getElementById('oldFrame');
    const newFrame = document.getElementById('newFrame');
    const newUrl = document.getElementById('newUrl');

    newFrame.addEventListener('load', () => {
      let frameDocument;
      try {
        frameDocument = newFrame.contentDocument;
      } catch (e) {
        return;
      }
      if (!frameDocument) return;

      frameDocument.addEventListener('click', (event) => {
        const link = event.target.closest('a');
        if (!link) return;
        const href = (link.getAttribute('href') || '').trim();
        if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;

        const filename = href.split('/').pop().split('?')[0].split('#')[0];
        const matched = pages[platform.value].find(([file]) => file === filename);
        if (matched) {
          page.value = matched[0];
          if (platform.value === 'app') {
            oldFrame.src = `app-screens/${matched[0]}`;
          }
        }
      }, true);
    });

    function updatePages() {
      page.replaceChildren();
      pages[platform.value].forEach(([file, label]) => {
        const option = document.createElement('option');
        option.value = file;
        option.textContent = label;
        page.appendChild(option);
      });
      updateFrames();
    }

    const comparison = document.querySelector('.comparison');
    const replayAnimBtn = document.getElementById('replayAnimBtn');

    function updateFrames() {
      if (platform.value === 'app') {
        comparison.classList.add('is-app');
        replayAnimBtn.style.display = 'inline-block';
      } else {
        comparison.classList.remove('is-app');
        replayAnimBtn.style.display = 'none';
      }

      if (platform.value === 'website') {
        const isNewOnly = page.value === '09-articles.html' || page.value === '10-videos.html' || page.value === '11-service-order.html';
        if (isNewOnly) {
          if (!oldFrame.src) oldFrame.src = 'website/01-home.html';
        } else {
          oldFrame.src = `website/${page.value}`;
        }
        newFrame.src = newUrl.value.trim() || `website-new/${page.value}`;
      } else {
        const url = `app-screens/${page.value}`;
        oldFrame.src = url;
        newFrame.src = newUrl.value.trim() || `app-screens-new/${page.value}?t=${Date.now()}`;
      }
    }

    platform.addEventListener('change', updatePages);
    page.addEventListener('change', updateFrames);
    document.getElementById('loadNew').addEventListener('click', () => {
      if (platform.value === 'website') {
        newFrame.src = newUrl.value.trim() || `website-new/${page.value}`;
      } else {
        newFrame.src = newUrl.value.trim() || `app-screens-new/${page.value}?t=${Date.now()}`;
      }
    });

    replayAnimBtn.addEventListener('click', () => {
      try {
        if (newFrame.contentWindow && typeof newFrame.contentWindow.tknReplayAnimation === 'function') {
          newFrame.contentWindow.tknReplayAnimation();
        } else {
          newFrame.src = (newUrl.value.trim() || `app-screens-new/${page.value}`) + `?t=${Date.now()}`;
        }
      } catch (e) {
        newFrame.src = (newUrl.value.trim() || `app-screens-new/${page.value}`) + `?t=${Date.now()}`;
      }
    });

    function hideSwitchButtons(frame) {
      try {
        const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
        if (!doc) return;
        const style = doc.createElement('style');
        style.textContent = 'a[href*="website/01-home.html"], a[href*="app-screens/01-home.html"] { display: none !important; }';
        doc.head.appendChild(style);
        Array.from(doc.querySelectorAll('a, button')).forEach((el) => {
          if (el.textContent.includes('عرض الموقع') || el.textContent.includes('عرض التطبيق')) {
            el.remove();
          }
        });
      } catch (e) {}
    }

    oldFrame.addEventListener('load', () => hideSwitchButtons(oldFrame));
    newFrame.addEventListener('load', () => hideSwitchButtons(newFrame));

    updatePages();
  </script>
</body>
</html>
