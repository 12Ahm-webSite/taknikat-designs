 النوع: شاشة تطبيق Flutter (مرجع بصري بعرض 390) — تُبنى في Flutter بنفس المقاسات والألوان
 
 ماذا تحتوي الصفحة وكيف تعمل:
   - الغلاف = المنشور الرئيسي، دعوة صديق، مشاركة.

   - تبويبات بكلمات بدل الأيقونات، والمعرض بلا قص.

   - هذا الملف تصميم مرجعي ثابت: البيانات أمثلة، والخانات الرمادية أماكن للصور الحقيقية.
   - الأنماط مكتوبة داخل العناصر (inline) لسهولة النقل؛ القيم مأخوذة من متغيرات الهوية أعلى الصفحة.
   - اتجاه الصفحة RTL؛ النسخة الإنجليزية نفس التصميم بعكس الاتجاه (dir="ltr").
 
-->
